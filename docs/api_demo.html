<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유사 투수 API 데모</title>
<!--
  백엔드(main.py) API 호출 예시 페이지 — 프론트엔드 참고용
  1) python main.py 로 백엔드 실행 (기본 http://127.0.0.1:8000)
  2) 이 파일을 브라우저로 열기 (더블클릭)
  3) MLB ID, 연도 입력 후 검색
  흐름: GET /{id}/{year} → 유사 투수 + 두 선수 프로필 표시
        → GET llm_url → LLM 영역만 교체
-->
<style>
  body { font-family: system-ui, "Malgun Gothic", sans-serif; max-width: 820px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  h3 { font-size: 15px; margin: 0 0 4px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  input { padding: 6px 8px; font-size: 14px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; }
  .box { border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin-bottom: 12px; min-height: 24px; }
  .box > h2 { font-size: 14px; margin: 0 0 10px; color: #666; }
  .muted { color: #888; }
  .error { color: #c0392b; }
  .cards { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .card { border: 1px solid #eee; border-radius: 6px; padding: 10px; min-width: 0; }
  .card .sub { color: #666; font-size: 13px; margin-bottom: 8px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { padding: 4px 6px; border-bottom: 1px solid #eee; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: #666; font-weight: 600; }
  tr.primary td { font-weight: 700; background: #f7f9fc; }
  .context { font-size: 13px; color: #444; margin-top: 10px; }
  .rec { border-top: 1px solid #eee; padding-top: 8px; margin-top: 8px; font-size: 14px; }
  .rec ul { margin: 4px 0; padding-left: 18px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: #eef2f7; color: #345; margin-left: 4px; }
  pre { background: #f6f6f6; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>⚾ 유사 투수 API 데모</h1>

  <form id="search-form">
    <input id="api" value="http://127.0.0.1:8000" size="24" title="백엔드 주소">
    <input id="player-id" type="number" placeholder="MLB ID (예: 660271)" required>
    <input id="year" type="number" placeholder="연도 (예: 2023)" required>
    <button type="submit">검색</button>
  </form>

  <div class="box">
    <h2>① 유사 투수 · 선수 프로필 — GET /{id}/{year}</h2>
    <div id="nearest" class="muted">검색해 주세요.</div>
  </div>

  <div class="box">
    <h2>② LLM 분석 — GET {llm_url}</h2>
    <div id="llm" class="muted">-</div>
  </div>

<script>
const nearestBox = document.getElementById("nearest");
const llmBox = document.getElementById("llm");
let controller = null;   // 새 검색 시 이전 요청을 취소하기 위한 컨트롤러

// ---------------------------------------------------------------- 공통 도우미
// 오류 응답(404, 503 등)이면 FastAPI 의 detail 메시지를 꺼내 예외로 던진다
async function getJson(url, signal) {
  const res = await fetch(url, { signal });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(`${res.status} ${body.detail ?? res.statusText}`);
  return body;
}

// DOM 요소 만들기 — 문자열은 textContent 로 넣어 HTML 이 해석되지 않게 한다
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => (k === "class" ? (node.className = v) : node.setAttribute(k, v)));
  children.flat().forEach((c) => c != null && node.append(c instanceof Node ? c : String(c)));
  return node;
}

function show(box, text, cls = "") {
  box.className = cls;
  box.textContent = text;
}

function render(box, ...nodes) {
  box.className = "";
  box.replaceChildren(...nodes);
}

const fmt = (v, digits = 1) => (v == null ? "-" : Number(v).toFixed(digits));
const signed = (v, digits = 1) => (v == null ? "-" : (v > 0 ? "+" : "") + Number(v).toFixed(digits));

// ---------------------------------------------------------------- ① 선수 프로필
// profiles.input_pitcher / similar_pitcher 한 명을 카드로 그린다
function pitcherCard(title, p) {
  if (!p) return el("div", { class: "card muted" }, el("h3", {}, title), "프로필 없음");
  const fb = p.primary_fastball;
  const sub = [
    `${p.season} 시즌`, `${p.throws === "L" ? "좌투" : "우투"}`,
    fb ? `주 패스트볼 ${fb.pitch_type} ${fmt(fb.velo_mph)}mph · IVB ${fmt(fb.ivb_in)} · HB ${fmt(fb.hb_in)}` : null,
    fb ? `팔 각도 ${fmt(fb.arm_angle_deg)}° · 익스텐션 ${fmt(fb.extension_ft)}ft` : null,
  ].filter(Boolean).join(" | ");

  const head = el("tr", {}, ["구종", "구사율", "구속", "IVB", "HB", "Whiff%", "Chase%", "RV/100"].map((h) => el("th", {}, h)));
  const rows = p.arsenal.map((a) =>
    el("tr", { class: a.is_primary_fastball ? "primary" : "" },
      el("td", {}, `${a.pitch_name ?? a.pitch_type} (${a.pitch_type})`, a.small_sample ? el("span", { class: "tag" }, "표본 작음") : null),
      el("td", {}, `${fmt(a.usage_pct)}%`),
      el("td", {}, fmt(a.velo_mph)),
      el("td", {}, fmt(a.ivb_in)),
      el("td", {}, fmt(a.hb_in)),
      el("td", {}, fmt(a.whiff_pct)),
      el("td", {}, fmt(a.chase_pct)),
      el("td", {}, signed(a.rv_per_100, 2)),
    ));

  return el("div", { class: "card" },
    el("h3", {}, `${title} — ${p.player_name} (MLB ID ${p.pitcher_id})`),
    el("div", { class: "sub" }, sub),
    el("div", { class: "table-wrap" }, el("table", {}, el("thead", {}, head), el("tbody", {}, rows))),
  );
}

function renderProfiles(first) {
  const nodes = [];
  if (!first.matched) nodes.push(el("p", { class: "muted" }, first.message));   // "조건에 맞는 유사 투수를 찾지 못했습니다."
  else nodes.push(el("p", {}, `유사 투수: MLB ID ${first.nearest.player_id} · ${first.nearest.year} 시즌`));

  const pr = first.profiles;
  if (!pr) {
    nodes.push(el("p", { class: "error" }, `프로필을 불러오지 못했습니다: ${first.profile_error}`));
    return nodes;
  }
  nodes.push(el("div", { class: "cards" },
    pitcherCard("입력 투수", pr.input_pitcher),
    first.matched ? pitcherCard("유사 투수", pr.similar_pitcher) : null,
  ));

  const c = pr.search_context;
  if (c) {
    nodes.push(el("div", { class: "context" },
      `클러스터 ${c.cluster} · 주 패스트볼 구속 ${fmt(c.input_avg_velocity)} vs ${fmt(c.similar_avg_velocity)}mph · ` +
      `FIP ${fmt(c.input_fip, 2)} vs ${fmt(c.similar_fip, 2)} · 투구 폼 거리 ${fmt(c.form_distance, 3)}`));
  }
  return nodes;
}

// ---------------------------------------------------------------- ② LLM 답변
function renderLlm(llm) {
  const r = llm.response ?? {};
  const nodes = [];
  if (r.summary) nodes.push(el("p", {}, r.summary));

  (r.recommendations ?? []).forEach((rec) => {
    const t = rec.target_shape ?? {};
    nodes.push(el("div", { class: "rec" },
      el("strong", {}, `${rec.rank}. ${rec.pitch_name} (${rec.pitch_type})`),
      el("span", { class: "tag" }, rec.action),
      el("span", { class: "tag" }, `신뢰도 ${rec.confidence}`),
      el("div", { class: "muted" }, `목표 shape: ${fmt(t.velo_mph)}mph · IVB ${fmt(t.ivb_in)} · HB ${fmt(t.hb_in)}`),
      el("ul", {}, (rec.rationale ?? []).map((x) => el("li", {}, x))),
      rec.usage_plan ? el("div", {}, `사용 계획: ${rec.usage_plan}`) : null,
    ));
  });

  if ((llm.validation_warnings ?? []).length) {
    nodes.push(el("p", { class: "error" }, `검증 경고: ${llm.validation_warnings.join(" / ")}`));
  }
  nodes.push(el("p", { class: "muted" }, `모델 ${llm.model ?? "-"} · ${llm.created_at ?? ""}`));

  // 전체 응답은 접어서 보여 준다 (failure_cases, not_recommended 등 나머지 필드 확인용)
  nodes.push(el("details", {}, el("summary", {}, "전체 JSON 보기"), el("pre", {}, JSON.stringify(llm, null, 2))));
  return nodes;
}

// ---------------------------------------------------------------- 검색 흐름
async function search(api, id, year) {
  controller?.abort();                 // 이전 검색의 느린 LLM 요청이 화면을 덮어쓰지 않도록 취소
  controller = new AbortController();
  const { signal } = controller;

  show(nearestBox, "유사 투수 찾는 중...", "muted");
  show(llmBox, "-", "muted");

  try {
    // ① 유사 투수 + 프로필 (빠름)
    const first = await getJson(`${api}/${id}/${year}`, signal);
    render(nearestBox, ...renderProfiles(first));
    if (!first.matched) return;

    // ② LLM 분석 (느림) — 이 영역만 로딩 → 결과로 교체
    show(llmBox, "LLM 분석 중...", "muted");
    try {
      const second = await getJson(api + first.llm_url, signal);
      render(llmBox, ...renderLlm(second.llm));
    } catch (err) {
      if (err.name !== "AbortError") show(llmBox, `분석을 불러오지 못했습니다: ${err.message}`, "error");
    }
  } catch (err) {
    if (err.name !== "AbortError") show(nearestBox, `오류: ${err.message}`, "error");
  }
}

document.getElementById("search-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const api = document.getElementById("api").value.replace(/\/+$/, "");
  search(api, document.getElementById("player-id").value, document.getElementById("year").value);
});
</script>
</body>
</html>
